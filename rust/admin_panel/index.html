<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouMean Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #c9d1d9;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Top bar: title + notification bell ── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 42px;
            font-weight: 300;
            background: linear-gradient(135deg, #14b8a6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .notif-bell {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(20, 184, 166, 0.2);
            background: rgba(20, 184, 166, 0.08);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
        }

        .notif-bell:hover {
            background: rgba(20, 184, 166, 0.18);
            border-color: rgba(20, 184, 166, 0.4);
            transform: translateY(-50%) scale(1.05);
        }

        .notif-bell.active {
            background: rgba(20, 184, 166, 0.22);
            border-color: rgba(20, 184, 166, 0.5);
        }

        .notif-bell svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #14b8a6;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .notif-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid #0d1117;
            display: none;
            animation: pulse-dot 2s infinite;
        }

        .notif-dot.visible {
            display: block;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0); }
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(20, 184, 166, 0.1);
            border: 1px solid rgba(20, 184, 166, 0.3);
            padding: 24px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            font-size: 12px;
            font-weight: 400;
            color: #8b949e;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: 300;
            color: #14b8a6;
        }

        .actions-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-refresh {
            background: rgba(20, 184, 166, 0.15);
            color: #14b8a6;
            border: 1px solid rgba(20, 184, 166, 0.3);
        }

        .btn-refresh:hover:not(:disabled) {
            background: rgba(20, 184, 166, 0.25);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.25);
        }

        .requests-grid {
            display: grid;
            gap: 20px;
        }

        .request-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(20, 184, 166, 0.2);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .request-card:hover {
            border-color: rgba(20, 184, 166, 0.5);
            box-shadow: 0 8px 32px rgba(20, 184, 166, 0.15);
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(20, 184, 166, 0.1);
        }

        .request-id-section {
            flex: 1;
        }

        .request-id-label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .request-id {
            font-size: 13px;
            color: #14b8a6;
            font-family: 'Monaco', monospace;
            word-break: break-all;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .status-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .request-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 14px;
            color: #c9d1d9;
            font-weight: 400;
        }

        .belief-badges {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-science {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-god {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .badge-spiritual {
            background: rgba(236, 72, 153, 0.2);
            color: #ec4899;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .card-actions {
            display: flex;
            gap: 12px;
        }

        .btn-export {
            flex: 1;
            background: linear-gradient(135deg, #14b8a6, #06b6d4);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-export:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(20, 184, 166, 0.3);
        }

        .btn-import {
            flex: 1;
            background: rgba(6, 182, 212, 0.2);
            color: #06b6d4;
            border: 1px solid rgba(6, 182, 212, 0.5);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-import:hover:not(:disabled) {
            background: rgba(6, 182, 212, 0.3);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #14b8a6;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(20, 184, 166, 0.1);
            border-radius: 50%;
            border-top-color: #14b8a6;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        input[type="file"] {
            display: none;
        }

        /* ── Feedback tray (slide-out panel) ── */
        .tray-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .tray-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .feedback-tray {
            position: fixed;
            top: 0;
            right: 0;
            width: 420px;
            max-width: 90vw;
            height: 100vh;
            background: #0d1117;
            border-left: 1px solid rgba(20, 184, 166, 0.15);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.4);
        }

        .feedback-tray.open {
            transform: translateX(0);
        }

        .tray-header {
            padding: 24px 24px 20px;
            border-bottom: 1px solid rgba(20, 184, 166, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .tray-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tray-title {
            font-size: 18px;
            font-weight: 500;
            color: #e6edf3;
        }

        .tray-badge {
            background: rgba(20, 184, 166, 0.15);
            color: #14b8a6;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .tray-close {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: #8b949e;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tray-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #c9d1d9;
        }

        .tray-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .tray-body::-webkit-scrollbar {
            width: 5px;
        }
        .tray-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .tray-body::-webkit-scrollbar-thumb {
            background: rgba(20, 184, 166, 0.2);
            border-radius: 10px;
        }

        .tray-empty {
            text-align: center;
            padding: 60px 20px;
            color: #484f58;
        }

        .tray-empty svg {
            width: 48px;
            height: 48px;
            stroke: #30363d;
            fill: none;
            stroke-width: 1.2;
            margin-bottom: 16px;
        }

        .tray-empty p {
            font-size: 14px;
            color: #484f58;
        }

        /* Feedback ticket inside tray */
        .fb-ticket {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }

        .fb-ticket:hover {
            border-color: rgba(20, 184, 166, 0.3);
        }

        .fb-ticket-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .fb-ticket-time {
            font-size: 12px;
            color: #8b949e;
        }

        .fb-ticket-id {
            font-size: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            color: #30363d;
            background: rgba(48, 54, 61, 0.5);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .fb-ticket-msg {
            font-size: 13px;
            line-height: 1.65;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .fb-ticket-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #14b8a6;
            margin-right: 8px;
            vertical-align: middle;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>YouMean Admin Panel</h1>
            <div class="notif-bell" id="notif-bell" onclick="toggleTray()">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <div class="notif-dot" id="notif-dot"></div>
            </div>
        </div>
        <div class="subtitle">Manage requests and process Mind Selfies</div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Requests</h3>
                <div class="number" id="total-count">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <div class="number" id="pending-count">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div class="number" id="completed-count">0</div>
            </div>
        </div>

        <div class="actions-bar">
            <button class="btn btn-refresh" onclick="loadRequests()">
                <span>🔄</span> Refresh
            </button>
            <button class="btn btn-danger" onclick="wipeAllRequests()">
                <span>🗑️</span> Wipe All
            </button>
        </div>

        <div class="requests-grid" id="requests-list">
            <div class="loading">
                <div class="spinner"></div>
                <div style="margin-top: 16px;">Loading requests...</div>
            </div>
        </div>
    </div>

    <!-- Feedback tray overlay -->
    <div class="tray-overlay" id="tray-overlay" onclick="closeTray()"></div>

    <!-- Feedback slide-out tray -->
    <div class="feedback-tray" id="feedback-tray">
        <div class="tray-header">
            <div class="tray-header-left">
                <span class="tray-title">Feedback</span>
                <span class="tray-badge" id="tray-badge">0</span>
            </div>
            <button class="tray-close" onclick="closeTray()">&times;</button>
        </div>
        <div class="tray-body" id="tray-body">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let trayOpen = false;
        let feedbackData = [];

        // ── Tray toggle ──
        function toggleTray() {
            trayOpen ? closeTray() : openTray();
        }

        function openTray() {
            trayOpen = true;
            document.getElementById('feedback-tray').classList.add('open');
            document.getElementById('tray-overlay').classList.add('open');
            document.getElementById('notif-bell').classList.add('active');
            document.getElementById('notif-dot').classList.remove('visible');
            loadFeedback();
        }

        function closeTray() {
            trayOpen = false;
            document.getElementById('feedback-tray').classList.remove('open');
            document.getElementById('tray-overlay').classList.remove('open');
            document.getElementById('notif-bell').classList.remove('active');
        }

        // Close tray on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && trayOpen) closeTray();
        });

        // ── Helpers ──
        function timeAgo(timestamp) {
            const seconds = Math.floor(Date.now() / 1000 - timestamp);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            return new Date(timestamp * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Stats ──
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/stats`);
                const stats = await response.json();

                document.getElementById('total-count').textContent = stats.total_requests;
                document.getElementById('pending-count').textContent = stats.pending_requests;
                document.getElementById('completed-count').textContent = stats.completed_today;

                // Show red dot if there is feedback
                const count = stats.feedback_count || 0;
                if (count > 0 && !trayOpen) {
                    document.getElementById('notif-dot').classList.add('visible');
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // ── Feedback tray content ──
        async function loadFeedback() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/feedback`);
                feedbackData = await response.json();

                const badge = document.getElementById('tray-badge');
                badge.textContent = feedbackData.length;

                const body = document.getElementById('tray-body');

                if (feedbackData.length === 0) {
                    body.innerHTML = `
                        <div class="tray-empty">
                            <svg viewBox="0 0 24 24">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                            <p>No feedback yet</p>
                        </div>
                    `;
                    return;
                }

                body.innerHTML = feedbackData.map(item => `
                    <div class="fb-ticket">
                        <div class="fb-ticket-top">
                            <span class="fb-ticket-time"><span class="fb-ticket-dot"></span>${timeAgo(item.submitted_at)}</span>
                            <span class="fb-ticket-id">#${item.id.substring(0, 8)}</span>
                        </div>
                        <div class="fb-ticket-msg">${escapeHtml(item.message)}</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading feedback:', error);
                document.getElementById('tray-body').innerHTML = `
                    <div class="tray-empty">
                        <p>Failed to load feedback</p>
                    </div>
                `;
            }
        }

        // ── Requests ──
        async function loadRequests() {
            await loadStats();

            try {
                const response = await fetch(`${API_BASE}/api/admin/pending`);
                const requests = await response.json();

                const listContainer = document.getElementById('requests-list');

                if (requests.length === 0) {
                    listContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h3>No requests yet</h3>
                            <p>Requests will appear here when users submit from umean.app</p>
                        </div>
                    `;
                    return;
                }

                listContainer.innerHTML = requests.map(req => `
                    <div class="request-card" id="card-${req.id}">
                        <div class="request-header">
                            <div class="request-id-section">
                                <div class="request-id-label">Request ID</div>
                                <div class="request-id">${req.id}</div>
                            </div>
                            <div class="status-badge status-${req.status}">${req.status}</div>
                        </div>

                        <div class="request-details">
                            <div class="detail-item">
                                <div class="detail-label">Birth City</div>
                                <div class="detail-value">${req.birth_city}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Birth Date</div>
                                <div class="detail-value">${req.birth_date}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Birth Time</div>
                                <div class="detail-value">${req.birth_time || 'Not specified'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Emotional State</div>
                                <div class="detail-value">${req.emotional_state}</div>
                            </div>
                        </div>

                        <div class="belief-badges">
                            ${req.belief_science ? '<span class="badge badge-science">Science</span>' : ''}
                            ${req.belief_god ? '<span class="badge badge-god">God</span>' : ''}
                            ${req.belief_spirituality ? '<span class="badge badge-spiritual">Spirituality</span>' : ''}
                        </div>

                        <div class="card-actions">
                            <button class="btn-export" onclick="exportRequest('${req.id}')">
                                📊 Export as CSV
                            </button>
                            <input type="file" id="import-${req.id}" accept=".csv" onchange="importRequest('${req.id}')" />
                            <button class="btn-import" onclick="document.getElementById('import-${req.id}').click()">
                                📥 Import CSV
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading requests:', error);
                document.getElementById('requests-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Error loading requests</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function exportRequest(requestId) {
            try {
                const response = await fetch(`${API_BASE}/api/admin/export-csv`);
                const csvText = await response.text();

                const lines = csvText.split('\n');
                const header = lines[0];
                const dataRow = lines.find(line => line.startsWith(`"${requestId}"`));

                if (!dataRow) {
                    alert('Request not found in export');
                    return;
                }

                const filteredCSV = `${header}\n${dataRow}`;
                const blob = new Blob([filteredCSV], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `request_${requestId.substring(0, 8)}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

            } catch (error) {
                console.error('Error exporting request:', error);
                alert('Failed to export: ' + error.message);
            }
        }

        async function importRequest(requestId) {
            const fileInput = document.getElementById(`import-${requestId}`);
            const file = fileInput.files[0];

            if (!file) return;

            try {
                const csvText = await file.text();

                const response = await fetch(`${API_BASE}/api/admin/import-csv`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/csv'
                    },
                    body: csvText
                });

                const result = await response.json();

                if (result.success && result.updated > 0) {
                    alert(`Success! Imported results for ${result.updated} request(s)`);
                    loadRequests();
                } else {
                    alert(`Import failed: ${result.message}\n\n${result.errors ? result.errors.join('\n') : ''}`);
                }

            } catch (error) {
                console.error('Error importing CSV:', error);
                alert('Failed to import: ' + error.message);
            }

            fileInput.value = '';
        }

        async function wipeAllRequests() {
            if (!confirm('WARNING: This will DELETE ALL requests from the database!\n\nAre you sure?')) {
                return;
            }

            if (!confirm('FINAL WARNING: This action CANNOT be undone!\n\nDelete all requests?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/admin/wipe-all`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    loadRequests();
                } else {
                    alert('Failed: ' + result.message);
                }

            } catch (error) {
                console.error('Error wiping requests:', error);
                alert('Failed to wipe: ' + error.message);
            }
        }

        // ── Init ──
        loadRequests();

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadRequests();
            if (trayOpen) loadFeedback();
        }, 30000);
    </script>
</body>
</html>
